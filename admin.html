<style>/* DIAG-050: the owner area is a work tool — no targeting reticle or chapter captions over tables, and a calmer background */
  .hud-ret, .hud-br, .hud-scene { display: none !important; }
  canvas.cosmos { opacity: .35; }
  /* BACKOFFICE-002 dynamic 3D depth on frames only, text stays flat; motion = transform/opacity ≤180 ms, once */
  .need { position: relative; transform-style: preserve-3d; transition: transform .16s ease, box-shadow .16s ease; border-left: 3px solid #5a5a5a; }
  .need.l2 { border-left-color: #bdbdbd; } .need.l3 { border-left-color: #fff; }
  .need::after { content: ""; position: absolute; inset: 6px -6px -6px 6px; border: 1px solid rgba(255,255,255,.07); border-radius: inherit; z-index: -1; pointer-events: none; transform: translateZ(-1px); }   /* the panel behind: a stacked layer */
  .need:hover, .need:focus-within { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  .need-lvl { font: 600 .64rem/1 var(--mono, ui-monospace, monospace); letter-spacing: .14em; text-transform: uppercase; color: #9a9a9a; writing-mode: vertical-rl; transform: rotate(180deg); }
  .need.l3 .need-lvl { color: #fff; } .need.l2 .need-lvl { color: #cfcfcf; }
  .need-sum { margin: 0 0 10px; color: #bdbdbd; } .need-new { margin: 0 0 10px; }
  #dash [hidden] { display: none !important; }   /* buttons and panels marked hidden really stay hidden */
  .instr { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; margin-top: 16px; position: relative; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(10,10,12,.92); }
  .instr::before { content: ""; position: absolute; inset: -8px 8px auto 8px; height: 8px; border: 1px solid rgba(255,255,255,.08); border-bottom: 0; border-radius: 10px 10px 0 0; transform: perspective(600px) rotateX(38deg); transform-origin: bottom; pointer-events: none; }   /* the instrument's top bevel */
  .instr-cell { padding: 16px 18px; border-right: 1px solid rgba(255,255,255,.08); } .instr-cell:last-child { border-right: 0; }
  .instr .lbl { font: 600 .66rem/1 var(--mono, ui-monospace, monospace); letter-spacing: .14em; text-transform: uppercase; color: #9a9a9a; }
  .instr-big { font-size: 1.5rem; font-weight: 650; margin: 8px 0 10px; letter-spacing: -.01em; } .instr-big .muted { font-size: .95rem; font-weight: 500; }
  .instr[data-state="Paused"] .instr-state .instr-big, .instr[data-state="Limit reached"] .instr-state .instr-big { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
  .instr.changed .instr-state { animation: stateIn .18s ease-out 1; }
  @keyframes stateIn { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
  .instr-form { display: flex; gap: 8px; margin: 8px 0 6px; } .instr-form input { max-width: 120px; } .instr-note { font-size: .8rem; }
  .spine { list-style: none; margin: 4px 0 0; padding: 0 0 0 22px; position: relative; }
  .spine::before { content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 1px; background: linear-gradient(#fff, rgba(255,255,255,.08)); }
  .spine li { position: relative; padding: 8px 0; }
  .spine li::before { content: ""; position: absolute; left: -20px; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: #0a0a0a; border: 1px solid #8a8a8a; }
  .spine li.a-owner::before { background: #fff; border-color: #fff; } .spine li.a-ai-boss::before { border-color: #fff; }
  .sp-sum { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 6px 8px; border-radius: 6px; transition: transform .14s ease, background .14s; color: inherit; font: inherit; }
  .sp-sum:hover, .sp-sum:focus-visible { background: rgba(255,255,255,.05); transform: translateX(3px); } .sp-sum:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .sp-sum[aria-expanded="true"] .sp-what::after { content: " ▴"; color: #9a9a9a; } .sp-sum[aria-expanded="false"] .sp-what::after { content: " ▾"; color: #6a6a6a; }
  .spine time { color: #9a9a9a; font-size: .8rem; font-variant-numeric: tabular-nums; min-width: 150px; }
  .sp-what { font-size: .9rem; } .sp-body { margin: 6px 0 4px 6px; padding: 10px 12px; border-left: 1px solid rgba(255,255,255,.18); font-size: .84rem; line-height: 1.6; }
  html[data-motion="off"] :is(.need, .sp-sum, .instr-state) { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) { :is(.need, .sp-sum, .instr-state) { transition: none !important; animation: none !important; } }
  /* BACKOFFICE-001 */
  .adm-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .adm-tools input[type=search] { flex: 1 1 260px; min-width: 0; }
  .adm-tools select { flex: 0 1 200px; }
  .adm-count { font-size: .8rem; margin-left: auto; }
  .adm-needs { display: grid; gap: 10px; }
  .need { display: grid; grid-template-columns: 16px 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; }
  .need .muted { font-size: .88rem; margin-top: 2px; }
  .need-dot { width: 10px; height: 10px; border-radius: 50%; background: #8a8a8a; }
  .need.l3 .need-dot { background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
  .need.l2 .need-dot { background: #cfcfcf; }
  .need-none { padding: 22px; }
  .ai-ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
  @media (max-width: 640px) { .instr-cell { border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08); } .need { grid-template-columns: 16px 1fr; } .need .btn { grid-column: 2; justify-self: start; } }

<script>
(function () {
  const { api, esc, money, toast, STATUS, C } = N;
  N.mountThemeMenu(document.getElementById("theme"), [["#money", N.ICONS.card, "Payments & payouts"]]);
  addEventListener("hashchange", () => { if (location.hash === "#money" && !dash.classList.contains("hidden")) { tab = "money"; draw(); } });
  if (!N.LIVE) document.getElementById("ribbon").classList.remove("hidden");
  const login = document.getElementById("login"), dash = document.getElementById("dash"), out = document.getElementById("out");
  let tab = location.hash === "#money" ? "money" : "needs", q = { orders: "", talent: "", ordersSt: "", history: "", dept: "" }, data = { jobs: [], talent: [], log: [], settings: {}, ratings: [], audit: [], ai: {}, ops: [], staff: [] };

  async function enter() {
    try {
      if (!(await api.session())) return;
      if (!(await api.isOwner())) {
        // two-step login: right account, second step still missing → ask for the 6-digit code instead of refusing
        if (await api.isOwnerAccount().catch(() => false) && await api.mfaNeeded().catch(() => false)) return askCode();
        toast("This account is not the owner."); await api.signOut(); return; }
      login.classList.add("hidden"); dash.classList.remove("hidden"); out.classList.remove("hidden");
      await load(); clearInterval(window._nLoad); window._nLoad = setInterval(load, 20000);   // one refresh timer, never stacked
    } catch (e) { toast(e.message); }
  }
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault(); const f = e.target;
    // logging back in reloads the page once, so every tab, timer and number starts fresh with the new session
    try { await api.signIn(f.email.value.trim(), f.password.value); if (N.LIVE && reloadOnce()) return; /* reload just happened → open the dashboard directly */ await enter(); } catch (err) { toast(err.message || "Sign-in failed"); }
  };
  out.onclick = async () => { await api.signOut(); location.reload(); };

  async function askCode() {
    const f = await api.mfaFactors().catch(() => []); if (!f.length) { toast("Two-step login is on, but no app was found. Sign in again."); return; }
    login.classList.remove("hidden");
    login.innerHTML = `<div class="card" style="max-width:420px;margin:60px auto"><h1 style="font-size:1.6rem;margin-top:0">Two-step login</h1>
      <p class="muted">Open your authenticator app and type the 6-digit code for HURANTEA.</p>
      <form id="codeF" class="form"><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
      <div><button class="btn btn-primary" type="submit">Continue</button> <button class="btn btn-ghost" type="button" id="codeOut">Sign out</button></div></form></div>`;
    document.getElementById("codeOut").onclick = async () => { await api.signOut(); location.reload(); };
    document.getElementById("codeF").onsubmit = async (e) => { e.preventDefault(); const b = e.target.querySelector("button[type=submit]"); b.disabled = true;
      try { await api.mfaVerify(f[0].id, e.target.code.value); location.reload(); } catch (err) { toast(err.message || "Wrong code — try the newest one in your app."); b.disabled = false; } };
  }
  async function mfaPanel() {
    const box = document.getElementById("mfaBox"); if (!box) return;
    let f = []; try { f = await api.mfaFactors(); } catch (e) { box.textContent = e.message; return; }
    if (f.length) { box.innerHTML = `<span class="tag ok">On</span> Your authenticator app is needed at every owner login. To remove or replace it, use Authentication → Users in Supabase.`; return; }
    box.innerHTML = `<span class="tag warn">Off</span> Protect the owner area with an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password…). Even with your password, nobody gets in without the code from your phone.
      <div style="margin-top:10px"><button class="btn btn-primary btn-sm" id="mfaOn">Turn on two-step login</button></div>`;
    document.getElementById("mfaOn").onclick = async () => {
      let en; try { en = await api.mfaEnroll(); } catch (e) { toast(e.message); return; }
      window._nHold = true;   // keep this screen while you scan
      box.innerHTML = `<ol style="margin:8px 0 10px 18px;padding:0"><li>Scan this QR code with your authenticator app.</li><li>Type the 6-digit code it shows.</li></ol>
        <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start"><img src="${esc(en.qr)}" alt="QR code for your authenticator app" width="176" height="176" style="background:#fff;padding:8px;border-radius:6px">
        <div><div class="muted" style="font-size:.82rem">Can't scan? Enter this key by hand:</div><code style="user-select:all;word-break:break-all">${esc(en.secret)}</code>
        <form id="mfaF" class="form" style="margin-top:10px"><label>6-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required></label><div><button class="btn btn-primary btn-sm" type="submit">Confirm and turn on</button></div></form></div></div>`;
      document.getElementById("mfaF").onsubmit = async (e) => { e.preventDefault();
        try { await api.mfaVerify(en.id, e.target.code.value); window._nHold = false; toast("Two-step login is on"); load(true); } catch (err) { toast(err.message || "Wrong code — try again."); } };
    };
  }

  async function load(force) {
    try { const [jobs, talent, log, settings, ratings, audit, ai, ops, staff] = await Promise.all([api.jobs(), api.talent(), api.log(), api.getSettings(), api.ratings(), api.audit().catch(() => []), api.aiUsage().catch(() => ({})), api.opsTasks().catch(() => []), api.staffList().catch(() => [])]);
      data = { jobs, talent, log, settings, ratings, audit, ai, ops, staff };
      // DIAG-051: the 20-second refresh never wipes what you are typing or a two-step setup in progress
      const a = document.activeElement, typing = a && dash.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
      const sig = JSON.stringify(needs().map((n) => n.title + n.detail));
      if (!force && tab === "needs" && window._nSig && sig !== window._nSig && !dash.classList.contains("hidden")) { const b = document.getElementById("needNew"); if (b) { b.hidden = false; return; } }
      if (force || !(typing || window._nHold)) draw(); }
    catch (e) { toast(e.message); }
  }

  // MATCH-001: ranked experts, who is being asked now, and the private link to send them (owner sends it — nothing is sent automatically)
  const CST = { waiting: ["next", ""], asking: ["asked now", "warn"], accepted: ["confirmed", "ok"], declined: ["declined", "bad"], expired: ["no answer", "bad"], client_declined: ["client wanted another", ""] };
  const expertLink = (key) => ((window.HURANTEA_CONFIG||{}).siteUrl ? window.HURANTEA_CONFIG.siteUrl.replace(/\/+$/, "") + "/" : location.href.replace(/admin\.html.*$/, "").replace(/#.*$/, "")) + "#/expert/" + key;   // owner area can live on its own page
  const KIND = { writing: "Writing", translation: "Translation", website: "Website (file)", spreadsheet: "Spreadsheet", research: "Research summary", code: "Small script" };
  function matchCell(j, q) {
    const C = j.candidates || [];
    if (j.route === "ai") return `<b>HURANTEA AI</b> <span class="tag" style="font-size:.7rem">${esc(KIND[j.ai_work?.kind] || j.ai_work?.kind || "AI")}</span><div class="muted" style="font-size:.8rem">A person: about ${money(q.humanEstimate)}${C.length ? ` · backup: ${esc(C.map((c) => c.name).join(", "))}` : ""}</div>`;
    if (!C.length) return q.talentName ? `${esc(q.talentName)}<div class="muted" style="font-size:.82rem">${q.hours}h × ${money(q.rate)}</div>` : `<span class="muted">${q.reason ? esc(q.reason) : "—"}</span>`;
    return C.map((c, i) => { const cs = CST[c.state] || [c.state, ""]; let send = "";
      if (c.state === "asking") { const t = data.talent.find((x) => x.id === c.tid) || {}, link = expertLink(c.key), contact = String(t.contact || "");
        const msg = `Hi ${c.name}, a new job on HURANTEA matches your skills: "${j.title}". Your pay: ${money(c.provider)} (${c.hours} h at your rate). Please accept or decline here: ${link}`;
        const phone = contact.replace(/[^\d]/g, ""), isMail = contact.includes("@");
        send = `<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-copy="${esc(link)}">Copy link</button>
          ${isMail ? `<a class="btn btn-ghost btn-sm" href="mailto:${esc(contact)}?subject=${encodeURIComponent("New job on HURANTEA: " + j.title)}&body=${encodeURIComponent(msg)}">Email</a>` : ""}
          ${!isMail && phone.length >= 8 ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}">WhatsApp</a>` : ""}
          <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${esc(link)}">Open</a></div>
          <div class="muted" style="font-size:.76rem">${esc(contact)} · asked ${new Date(c.asked_at).toLocaleString()}</div>`; }
      return `<div style="margin-bottom:6px"><b>${i + 1}. ${esc(c.name)}</b> <span class="tag ${cs[1]}" style="font-size:.7rem">${cs[0]}</span><div class="muted" style="font-size:.8rem">${c.hours}h × ${money(c.rate)} = ${money(c.provider)} · client ${money(c.total)}</div>${send}</div>`; }).join("");
  }

  // BACKOFFICE-001 ① what needs you — computed from the live data, most urgent first
  const ago = (t) => { const m = Math.max(0, (Date.now() - Date.parse(t)) / 60000); return m < 60 ? Math.round(m) + " min" : m < 2880 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " days"; };
  const hrs = (t) => (Date.now() - Date.parse(t)) / 3600e3;
  function needs() {
    const S = data.settings || {}, ch = Number(S.confirmHours || 12), out = [], add = (lvl, title, detail, go) => out.push({ lvl, title, detail, go });
    if (S.aiPaused) add(2, "AI Boss is paused", "New jobs are waiting until you resume it.", "boss");
    if (N.LIVE && data.ai?.heartbeat && hrs(data.ai.heartbeat) > 0.25) add(3, "AI Boss may have stopped", `Last run ${ago(data.ai.heartbeat)} ago. It should run every 5 minutes — check the cron job in Supabase.`, "boss");
    if ((data.ai?.today || 0) >= Number(S.aiDailyLimit || 200) * 0.9) add(2, "AI daily limit almost used", `${data.ai.today || 0} of ${S.aiDailyLimit || 200} AI calls used today.`, "boss");
    for (const j of data.jobs) {
      const w = j.ai_work || {};
      const ht = (data.ops || []).find((k) => k.job_id === j.id && k.dept === "human" && k.status !== "done");
      if (ht) add(ht.priority === "p1" || ht.priority === "p0" ? 3 : 2, ht.assignee ? "A person is finishing a job" : "Human needed", `"${j.title}" — ${ht.detail || "the AI could not finish it"}${ht.assignee ? "" : " Nobody has taken it yet."}`, "human");
      if (j.status === "clarify" && hrs(j.updated_at) > 48) add(1, "Client hasn't answered the AI's questions", `"${j.title}" — asked ${ago(j.updated_at)} ago. Contact ${j.client_name} (${j.client_contact}) or cancel the request.`, "orders");
      if (j.route === "ai" && j.status === "ai_check") add(2, "AI sample to check", `"${j.title}" — ${j.client_name} is waiting for the free sample and the price.`, "aiwork");
      if (j.route === "ai" && j.status === "accepted" && w.final && !w.approved) add(3, "AI work to check", `"${j.title}" — the client has paid. Check it and deliver.`, "aiwork");
      if (j.route === "ai" && j.status === "accepted" && !w.final && Number(w.fails || 0) >= 3) add(3, "AI work failed", `"${j.title}" — the AI could not finish it 3 times (${w.last_error || "error"}). Press Redo with AI in Orders → AI work, or refund the client.`, "aiwork");
      else if (j.route === "ai" && j.status === "accepted" && j.payment_status === "held" && !w.final && hrs(j.updated_at) > 0.5) add(2, "AI work not made yet", `"${j.title}" — paid ${ago(j.updated_at)} ago. Check that the AI Boss is running.`, "boss");
      const c = (j.candidates || []).find((x) => x.state === "asking");
      if (j.status === "asking" && c && hrs(c.asked_at) > ch / 2) add(2, `${c.name} hasn't answered`, `"${j.title}" — asked ${ago(c.asked_at)} ago. Send a reminder, or wait: after ${ch} h the next expert is asked automatically.`, "orders");
      if (j.status === "no_match") add(3, "No expert could confirm", `"${j.title}" — contact ${j.client_name} (${j.client_contact}) or find a new expert for these skills.`, "orders");
      if (j.status === "searching" && hrs(j.updated_at || j.created_at) > 1) add(2, "No expert in your network fits", `"${j.title}" — recruit someone with these skills${j.skills?.length ? ": " + [].concat(j.skills).join(", ") : ""}.`, "orders");
      if (j.status === "accepted" && j.payment_status === "awaiting" && hrs(j.updated_at) > 24) add(2, "Payment not received", `"${j.title}" — accepted ${ago(j.updated_at)} ago. Check with the client.`, "orders");
      if (j.status === "accepted" && j.payment_status === "held" && hrs(j.updated_at) > 24 * 7) add(2, "Delivery may be late", `"${j.title}" — paid ${ago(j.updated_at)} ago, not delivered yet.`, "orders");
      if (j.status === "delivered" && hrs(j.updated_at) > 24 * Number(S.releaseAfterDays || 7)) add(1, "Ready to release", `"${j.title}" — delivered ${ago(j.updated_at)} ago with no complaint.`, "orders");
      if (j.status === "paid" && j.payout_status === "pending") add(2, "Payout to send", `"${j.title}" — ${money(j.quote?.providerPrice)} to ${j.quote?.talentName || "the expert"}.`, "money");
    }
    for (const t of data.talent) if (!t.id_verified && t.status === "active") add(1, "ID and age check", `${t.name} (${t.country || "—"}) joined ${ago(t.created_at)} ago — check ID before they can get paid jobs.`, "talent");
    const rc = data.ratings.filter((r) => r.comment && !r.approved).length; if (rc) add(1, `${rc} comment(s) to review`, "Approve or hide before they appear on the website.", "ratings");
    return out.sort((a, b) => b.lvl - a.lvl);
  }
  // OPS-001 the HURANTEA Ops board: one card per thing in motion, by department (= AI agent) and state, plus your own tasks
  const DEPTS = { operations: "Operations", growth: "Growth & Sales", delivery: "Delivery & Matching", quality: "Quality & Safety", finance: "Finance & Risk", support: "Support & Reliability", human: "Human board" };

    dash.querySelectorAll("[data-q]").forEach((i) => (i.oninput = () => { q[i.dataset.q] = i.value; applyQ(i.dataset.q); }));
    dash.querySelectorAll("[data-qs]").forEach((i) => (i.onchange = () => { q[i.dataset.qs] = i.value; applyQ(i.dataset.qs.replace(/St$/, "")); }));
    dash.querySelectorAll("[data-csv]").forEach((b) => (b.onclick = () => { const k = b.dataset.csv, t = q[k].toLowerCase().trim(), st = q[k + "St"] || "";
      const src = k === "orders" ? data.jobs : k === "talent" ? data.talent : data.audit;
      const rows = src.filter((r) => (!st || r.status === st) && (!t || JSON.stringify(r).toLowerCase().includes(t)));
      csv(k, k === "orders" ? rows.map((j) => ({ created: j.created_at, title: j.title, status: j.status, client: j.client_name, contact: j.client_contact, expert: j.quote?.talentName || "", price_usd: j.offer_usd, fee_usd: j.quote?.fee, expert_pay_usd: j.quote?.providerPrice, payment: j.payment_status, payout: j.payout_status })) : rows);
      toast(`Exported ${rows.length} row(s)`); }));
    // AI controls
    const ap = document.getElementById("aiPause");
    if (ap) ap.onclick = async () => { const to = !data.settings.aiPaused; if (to && !confirm("Pause the AI Boss? New jobs will wait until you resume it.")) return;
      try { await api.saveSettings({ ...data.settings, aiPaused: to }); toast(to ? "AI Boss paused" : "AI Boss running again"); load(true); } catch (e) { toast(e.message); } };
    const al = document.getElementById("aiLimF");
    if (al) al.onsubmit = async (e) => { e.preventDefault(); const v = Math.max(1, Math.min(100000, Math.round(Number(al.lim.value) || 200)));
      try { await api.saveSettings({ ...data.settings, aiDailyLimit: v }); toast(`Daily AI limit: ${v}`); load(true); } catch (err) { toast(err.message); } };
    // FILES-001 open a client's file (live: a private link valid for one hour)
    dash.querySelectorAll("[data-jfile]").forEach((b) => (b.onclick = async () => { const j = data.jobs.find((x) => String(x.id) === b.dataset.jfile), f = j && (j.files || [])[+b.dataset.i]; if (!f) return;
      let u; try { u = new URL(await api.fileUrl(f), location.href).href; } catch (e) { return toast(e.message); }
      // shown in a panel on this page (works everywhere, also where new tabs are blocked), plus a new-tab link
      const img = f.preview ? new URL(f.preview, location.href).href : /^image\//.test(f.type || "") ? u : null, pdf = /pdf/.test(f.type || "") || /\.pdf$/i.test(f.name);
      let ov = document.getElementById("fileView"); if (!ov) { ov = document.createElement("div"); ov.id = "fileView"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.style.cssText = "position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px"; document.body.appendChild(ov); }
      ov.innerHTML = `<div class="card" style="width:min(900px,100%);max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><b>${esc(f.name)}</b><span style="display:flex;gap:8px"><a class="btn btn-ghost btn-sm" href="${esc(u)}" target="_blank" rel="noopener">Open in a new tab</a><button class="btn btn-primary btn-sm" id="fvClose">Close</button></span></div>
        ${img ? `<img src="${esc(img)}" alt="${esc(f.name)}" style="width:100%;height:auto;border-radius:6px;background:#fff">` : pdf ? `<iframe src="${esc(u)}" title="${esc(f.name)}" style="width:100%;height:70vh;border:0;border-radius:6px;background:#fff"></iframe>` : `<p class="muted">This file type can't be shown here. Use "Open in a new tab" to download it.</p>`}</div>`;
      ov.hidden = false; ov.style.display = "flex"; const close = () => { ov.style.display = "none"; ov.innerHTML = ""; }; document.getElementById("fvClose").onclick = close; ov.onclick = (ev) => { if (ev.target === ov) close(); }; document.getElementById("fvClose").focus(); }));
    // PIPE-001 Human board: finish it yourself, mark done, staff, notifications
    dash.querySelectorAll("[data-owndeliver]").forEach((b) => (b.onclick = async () => { const k = (data.ops || []).find((x) => x.id === b.dataset.owndeliver), j = k && data.jobs.find((x) => x.id === k.job_id);
      const t = dash.querySelector(`[data-ownwork="${b.dataset.owndeliver}"]`), v = (t && t.value || "").trim(); if (!j || v.length < 2) return toast("Write the finished work first.");
      if (!confirm("Deliver this to the client now?")) return; b.disabled = true;
      try { await api.updateJob(j.id, { status: "delivered", ai_work: { ...j.ai_work, final: v, final_at: new Date().toISOString(), final_by: "owner", approved: true, escalated: null } }); await api.updateOpsTask(k.id, { status: "done" }); toast("Delivered to the client"); } catch (e) { toast(e.message); } load(true); }));
    dash.querySelectorAll("[data-hdone]").forEach((b) => (b.onclick = async () => { try { await api.updateOpsTask(b.dataset.hdone, { status: "done" }); toast("Marked done"); } catch (e) { toast(e.message); } load(true); }));
    dash.querySelectorAll("[data-staff]").forEach((b) => (b.onclick = async () => { try { await api.updateStaff(b.dataset.staff, { active: b.dataset.to === "true" }); } catch (e) { toast(e.message); } load(true); }));
    const sf2 = document.getElementById("staffF");
    if (sf2) sf2.onsubmit = async (e) => { e.preventDefault(); const v = Object.fromEntries(new FormData(sf2).entries());
      try { const r = await api.addStaff(v.email.trim(), v.name.trim()); toast(r === "added" ? "Added to the team" : "No login with that email yet — create it in Supabase → Authentication → Users first."); if (r === "added") sf2.reset(); } catch (err) { toast(err.message); } load(true); };
    const po = document.getElementById("pushOwner"); if (po) po.onclick = async () => { try { await N.enablePush(api); toast("Notifications are on for this device."); } catch (e) { toast(e.message); } };
    // OPS-001 board: department filter, your tasks, copy the brief
    const qd = dash.querySelector("[data-qdept]"); if (qd) qd.onchange = () => { q.dept = qd.value; draw(); };
    dash.querySelectorAll("[data-ost]").forEach((sel) => (sel.onchange = async () => { try { await api.updateOpsTask(sel.dataset.ost, { status: sel.value }); toast("Task updated"); } catch (e) { toast(e.message); } load(true); }));
    const of = document.getElementById("opsF");
    if (of) of.onsubmit = async (e) => { e.preventDefault(); const v = Object.fromEntries(new FormData(of).entries()); if (!v.title.trim()) return;
      const b = of.querySelector("button[type=submit]"); b.disabled = true;
      try { await api.addOpsTask({ title: v.title.trim(), dept: v.dept, priority: v.priority, due: v.due || null, detail: v.detail.trim() || null }); toast("Task added"); of.reset(); } catch (err) { toast(err.message); } b.disabled = false; load(true); };
    const bc = document.getElementById("briefCopy"); if (bc) bc.onclick = () => navigator.clipboard?.writeText(B.text).then(() => toast("Brief copied"), () => prompt("Copy the brief:", B.text));
    // STRATEGY-001 AI work: approve, redo, or give it to a person
    dash.querySelectorAll("[data-aiok]").forEach((b) => (b.onclick = async () => { const j = data.jobs.find((x) => String(x.id) === b.dataset.aiok); if (!j) return; const w = j.ai_work || {}, q = j.quote || {}; b.disabled = true;
      try {
        if (j.status === "ai_check") { const inp = dash.querySelector(`[data-aiprice="${b.dataset.aiok}"]`), price = Math.max(1, Math.round((Number(inp && inp.value) || Number(q.total) || 5) * 100) / 100);
          await api.updateJob(j.id, { status: "quoted", offer_usd: price, offer_text: w.plan || "HURANTEA's AI will deliver the complete work.", quote: { ...q, total: price, fee: price } }); toast("Sample and price shown to the client"); }
        else { const fresh = (await api.jobs()).find((x) => String(x.id) === b.dataset.aiok) || j;   // approve exactly the version you read
          if (String((fresh.ai_work || {}).versions || 1) !== b.dataset.aiv || !(fresh.ai_work || {}).final) { toast("A newer version arrived — please check it first."); load(true); return; }
          await api.updateJob(j.id, { status: "delivered", ai_work: { ...w, approved: true, approved_at: new Date().toISOString() } }); toast("Delivered to the client"); }
      } catch (e) { toast(e.message); } load(true); }));
    dash.querySelectorAll("[data-airedo]").forEach((b) => (b.onclick = async () => { const j = data.jobs.find((x) => String(x.id) === b.dataset.airedo); if (!j) return; const note = (dash.querySelector(`[data-ainote="${b.dataset.airedo}"]`)?.value || "").trim().slice(0, 500);
      b.disabled = true; try { await api.updateJob(j.id, { ai_work: { ...j.ai_work, final: null, approved: false, note, fails: 0, escalated: null } }); toast("The AI is making a new version"); } catch (e) { toast(e.message); } load(true); }));
    dash.querySelectorAll("[data-aihuman]").forEach((b) => (b.onclick = async () => { const j = data.jobs.find((x) => String(x.id) === b.dataset.aihuman); if (!j || !confirm("Give this job to a human expert? The AI sample is not shown to the client.")) return; b.disabled = true;
      try { await api.updateJob(j.id, { route: "expert", status: "received", offer_usd: null, quote: null, offer_text: "We are asking a verified expert to take this on.", ai_work: { ...j.ai_work, handover: "owner", handover_at: new Date().toISOString() } }); toast("Sent to the expert flow"); } catch (e) { toast(e.message); } load(true); }));
    const asf = document.getElementById("aiSetF");
    if (asf) asf.onsubmit = async (e) => { e.preventDefault(); const fd = new FormData(asf);
      const v = { aiFirst: !!fd.get("aiFirst"), aiReview: !!fd.get("aiReview"), aiKinds: fd.getAll("kind"), aiPricePct: Math.max(5, Math.min(100, Math.round(Number(fd.get("aiPricePct")) || 50))), aiMinPrice: Math.max(1, Math.min(1000, Number(fd.get("aiMinPrice")) || 5)) };
      try { await api.saveSettings({ ...data.settings, ...v }); toast("AI settings saved"); load(true); } catch (err) { toast(err.message); } };
    mfaPanel();
    const rb = document.getElementById("runBoss");
    if (rb) rb.onclick = async () => { rb.disabled = true; try { const r = await api.runBoss(); toast(`Boss processed ${r.processed} job(s)`); } catch (e) { toast(e.message); } await load(); };
  }
  enter();
  // signed in or out in another tab, or the session ended → reload so this tab matches
  const reloadOnce = () => { let last = 0; try { last = +sessionStorage.getItem("hurantea-reload") || 0; } catch {}
    if (Date.now() - last < 8000) return false; try { sessionStorage.setItem("hurantea-reload", String(Date.now())); } catch {} location.reload(); return true; };   // never a reload loop
  api.onAuth((ev) => { const inDash = !dash.classList.contains("hidden");
    if ((ev === "SIGNED_IN" && !inDash) || (ev === "SIGNED_OUT" && inDash)) reloadOnce(); });
  // coming back to the tab refreshes the numbers right away instead of waiting for the next 20-second tick
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !dash.classList.contains("hidden")) load(); });
})();
</script>
</body>
</html>
